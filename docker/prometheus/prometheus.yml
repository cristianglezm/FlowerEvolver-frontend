global:
  scrape_interval: 10s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # service names and ports are the ones of docker-compose.yml
  - job_name: 'flowerevolver-backend'
    scheme: http
    static_configs:
      - targets: ['backend:5000']
    authorization:
      # the key is not read from the environment: docker-compose.yml mounts the file ./secrets/metrics_api_key
      # here and gives the same value to the backend and describe as METRICS_API_KEY
      credentials_file: /run/secrets/metrics_api_key

  - job_name: 'flowerevolver-describe'
    scheme: http
    static_configs:
      - targets: ['describe:8000']
    authorization:
      credentials_file: /run/secrets/metrics_api_key

  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka_exporter:9308']
